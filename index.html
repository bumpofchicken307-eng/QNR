<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライブ集計ステージ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans+JP', sans-serif; }
        .multi-line { white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
            <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">LIVE POLL STAGE</h1>
        </div>
        <div class="flex items-center space-x-3">
            <span id="roleBadge" class="text-xs px-3 py-1 rounded-full font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">参加者モード</span>
            <button onclick="switchRole()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition">
                モード切替
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-8 flex flex-col justify-center">

        <!-- 参加者画面 -->
        <div id="participantView" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-md text-center space-y-6">
                <div class="inline-block bg-indigo-500/10 text-indigo-400 text-xs font-bold px-4 py-1.5 rounded-full border border-indigo-500/20">
                    現在の質問・お題
                </div>
                <div id="displayQuestion" class="text-xl sm:text-3xl font-bold text-slate-100 min-h-[4rem] flex items-center justify-center multi-line leading-relaxed">
                    司会者がお題を設定するまでお待ちください...
                </div>

                <div id="voteContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6">
                    <button onclick="vote('A')" class="group relative overflow-hidden bg-gradient-to-br from-indigo-600 to-indigo-800 hover:from-indigo-500 hover:to-indigo-700 text-white font-black text-2xl py-6 px-8 rounded-2xl shadow-xl shadow-indigo-600/30 transform active:scale-95 transition duration-150 border border-indigo-400/30">
                        <span class="relative z-10">⭕️ そう思う (A)</span>
                    </button>
                    <button onclick="vote('B')" class="group relative overflow-hidden bg-gradient-to-br from-pink-600 to-rose-800 hover:from-pink-500 hover:to-rose-700 text-white font-black text-2xl py-6 px-8 rounded-2xl shadow-xl shadow-pink-600/30 transform active:scale-95 transition duration-150 border border-pink-400/30">
                        <span class="relative z-10">❌ 思わない (B)</span>
                    </button>
                </div>

                <div id="voteStatus" class="text-sm font-medium text-slate-400 pt-2 hidden">
                    ✨ 投票を受け付けました！結果発表をお待ちください。
                </div>
            </div>
        </div>

        <!-- 司会者画面 -->
        <div id="hostView" class="space-y-6 hidden">
            <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                    <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                        <span>⚙️ 司会者コントロールパネル</span>
                    </h2>
                    <button onclick="resetData()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                        🔄 状態をリセット
                    </button>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-300">お題・質問文</label>
                    <textarea id="inputQuestion" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 multi-line" placeholder="例：きのこ派ですか？たけのこ派ですか？"></textarea>
                    <button onclick="updateQuestion()" class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 font-bold py-3 rounded-xl border border-slate-700 transition">
                        お題を反映する
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-slate-300">結果発表の演出秒数 (秒)</label>
                        <input type="number" id="inputDuration" min="1" max="15" value="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-slate-300">演出用 MP3音声</label>
                        <input type="file" id="inputMp3" accept="audio/mp3" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-slate-800 file:text-indigo-300 hover:file:bg-slate-700 cursor-pointer">
                    </div>
                </div>

                <div class="pt-4">
                    <button onclick="triggerResult()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-xl py-4 rounded-2xl shadow-xl shadow-emerald-600/30 border border-emerald-400/30 transition transform active:scale-95">
                        🎬 結果発表スタート
                    </button>
                </div>
            </div>
        </div>

        <!-- 結果発表・演出オーバーレイ -->
        <div id="resultOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 hidden">
            <div class="text-center space-y-8 max-w-2xl w-full">
                <div id="shuffleTitle" class="text-indigo-400 text-xl font-bold tracking-widest uppercase animate-pulse">
                    集計中...
                </div>
                
                <div id="shuffleDisplay" class="text-7xl sm:text-9xl font-black tracking-tight text-white drop-shadow-[0_0_35px_rgba(99,102,241,0.5)]">
                    0
                </div>

                <div id="resultDetails" class="hidden space-y-6 pt-6">
                    <div class="text-3xl sm:text-4xl font-black text-indigo-300">結果発表完了！</div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-indigo-950/60 border border-indigo-500/30 p-6 rounded-2xl">
                            <div class="text-sm font-bold text-indigo-400">⭕️ そう思う (A)</div>
                            <div id="countA" class="text-4xl sm:text-6xl font-black text-white mt-2">0</div>
                        </div>
                        <div class="bg-pink-950/60 border border-pink-500/30 p-6 rounded-2xl">
                            <div class="text-sm font-bold text-pink-400">❌ 思わない (B)</div>
                            <div id="countB" class="text-4xl sm:text-6xl font-black text-white mt-2">0</div>
                        </div>
                    </div>
                    <button onclick="closeResult()" class="mt-8 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-8 py-3 rounded-xl border border-slate-700 transition">
                        画面を閉じる
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        Live Poll Stage &copy; 2026
    </footer>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sample-poll-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentRole = 'participant';
        let audioFileUrl = null;
        let audioPlayer = new Audio();

        function switchRole() {
            const pass = prompt("モードを切り替えるためのパスワードを入力してください（初期パスワード: host）:", "");
            if (pass === null) return;
            
            if (currentRole === 'participant') {
                if (pass === 'host') {
                    currentRole = 'host';
                    document.getElementById('participantView').classList.add('hidden');
                    document.getElementById('hostView').classList.remove('hidden');
                    document.getElementById('roleBadge').textContent = '司会者モード';
                    document.getElementById('roleBadge').className = 'text-xs px-3 py-1 rounded-full font-bold bg-pink-500/20 text-pink-300 border border-pink-500/30';
                } else {
                    alert('パスワードが違います。');
                }
            } else {
                currentRole = 'participant';
                document.getElementById('hostView').classList.add('hidden');
                document.getElementById('participantView').classList.remove('hidden');
                document.getElementById('roleBadge').textContent = '参加者モード';
                document.getElementById('roleBadge').className = 'text-xs px-3 py-1 rounded-full font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
            }
        }

        document.getElementById('inputMp3').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                audioFileUrl = URL.createObjectURL(file);
                audioPlayer.src = audioFileUrl;
            }
        });

        function updateQuestion() {
            const text = document.getElementById('inputQuestion').value;
            db.ref('question').set(text);
            alert('お題を更新しました！');
        }

        function vote(choice) {
            const userId = localStorage.getItem('poll_user_id') || 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('poll_user_id', userId);

            db.ref('votes/' + userId).set(choice).then(() => {
                document.getElementById('voteContainer').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('voteStatus').classList.remove('hidden');
            });
        }

        function resetData() {
            if (confirm('すべてのお題と投票データをリセットし、初期状態に戻しますか？')) {
                db.ref('question').set('司会者がお題を設定するまでお待ちください...');
                db.ref('votes').remove();
                db.ref('showResultData').remove();
                document.getElementById('voteContainer').classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('voteStatus').classList.add('hidden');
                alert('リセットしました。');
            }
        }

        function triggerResult() {
            const durationSec = parseInt(document.getElementById('inputDuration').value) || 3;
            db.ref('showResultData').set({
                active: true,
                duration: durationSec,
                timestamp: Date.now()
            });
        }

        db.ref('question').on('value', (snapshot) => {
            const q = snapshot.val();
            if (q) {
                document.getElementById('displayQuestion').textContent = q;
            }
        });

        db.ref('showResultData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.active) {
                startShuffleAnimation(data.duration);
            }
        });

        function startShuffleAnimation(durationSec) {
            const overlay = document.getElementById('resultOverlay');
            const shuffleDisplay = document.getElementById('shuffleDisplay');
            const shuffleTitle = document.getElementById('shuffleTitle');
            const resultDetails = document.getElementById('resultDetails');

            overlay.classList.remove('hidden');
            shuffleDisplay.classList.remove('hidden');
            shuffleTitle.classList.remove('hidden');
            resultDetails.classList.add('hidden');

            if (audioFileUrl) {
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(e => console.log('Audio play error:', e));
            }

            let durationMs = durationSec * 1000;
            let interval = setInterval(() => {
                let randomNum = Math.floor(Math.random() * 900) + 100;
                shuffleDisplay.textContent = randomNum;
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                if (audioFileUrl) {
                    audioPlayer.pause();
                }

                db.ref('votes').once('value', (snapshot) => {
                    let votes = snapshot.val() || {};
                    let countA = 0;
                    let countB = 0;
                    Object.values(votes).forEach(val => {
                        if (val === 'A') countA++;
                        if (val === 'B') countB++;
                    });

                    shuffleTitle.classList.add('hidden');
                    shuffleDisplay.classList.add('hidden');
                    document.getElementById('countA').textContent = countA;
                    document.getElementById('countB').textContent = countB;
                    resultDetails.classList.remove('hidden');
                });

            }, durationMs);
        }

        function closeResult() {
            document.getElementById('resultOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
